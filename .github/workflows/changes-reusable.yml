name: Changes - Reusable

on:
  workflow_call:
    outputs:
      code:
        description: Whether the change set reaches past the documentation site
        value: ${{ jobs.detect.outputs.code }}

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    runs-on: ubuntu-latest
    name: Changes
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      # A pull request resolves through the API, so only a merge group needs the
      # working tree the filter diffs against.
      - name: Checkout
        if: ${{ github.event_name == 'merge_group' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Filter paths
        id: filter
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # A file counts when it matches a pattern and no negated one, so the
          # filter reads as "anything that is not the documentation site".
          # Negated patterns alone would never match a thing.
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!docs/**'
      - name: Resolve change scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTERED_CODE: ${{ steps.filter.outputs.code }}
        run: |
          case "$EVENT_NAME" in
          pull_request | merge_group) code=$FILTERED_CODE ;;
          *) code=true ;;
          esac
          printf 'code=%s\n' "$code" >>"$GITHUB_OUTPUT"
          echo "code=$code"
