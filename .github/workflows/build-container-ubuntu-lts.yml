name: Ubuntu LTS Container

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - master
      - release/v*
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    name: Build Images
    uses: ./.github/workflows/build-container-reusable.yml
    with:
      container-runtime: noble
      runtime: linux-x64
      mode: build-only
      test-image-artifact-name: eventstore-test-image-noble-linux-x64
      image-artifact-name: eventstore-image-noble-linux-x64
    secrets: inherit

  test:
    name: Build (${{ matrix.test-group-name }})
    needs: build-images
    strategy:
      fail-fast: true
      matrix:
        include:
          - test-group-name: core-clientapi-persistent
          - test-group-name: core-clientapi-security
          - test-group-name: core-clientapi-streams
          - test-group-name: core-http
          - test-group-name: core-services
          - test-group-name: core-cluster-services
          - test-group-name: core-storage
          - test-group-name: core-hash-collisions
          - test-group-name: core-transforms
          - test-group-name: core-rest
          - test-group-name: core-xunit
          - test-group-name: projections
          - test-group-name: misc
    uses: ./.github/workflows/build-container-reusable.yml
    with:
      container-runtime: noble
      runtime: linux-x64
      mode: test-only
      test-image-artifact-name: eventstore-test-image-noble-linux-x64
      test-group-name: ${{ matrix.test-group-name }}
    secrets: inherit

  client-compatibility:
    name: Client Compatibility
    needs:
      - build-images
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install task runner
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.2
          install: false
          cache: false
      - name: Install net10.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Install Rust
        shell: bash
        run: |
          rustup set profile minimal
          rustup update stable
          rustup default stable
      - name: Resolve client revisions
        id: clients
        run: mise run --skip-tools github-actions:client-compatibility -- refs
      - name: Checkout C# client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TrogonStack/TrogonEventStore-Client-Dotnet
          ref: ${{ steps.clients.outputs.dotnet }}
          path: .github/compatibility/clients/dotnet
          persist-credentials: false
      - name: Checkout Rust client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TrogonStack/TrogonEventStore-Client-Rust
          ref: ${{ steps.clients.outputs.rust }}
          path: .github/compatibility/clients/rust
          persist-credentials: false
      - name: Download server image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eventstore-image-noble-linux-x64
      - name: Load server image
        run: mise run --skip-tools github-actions:container -- load-runtime
      - name: Run client compatibility gate
        run: mise run --skip-tools github-actions:client-compatibility -- run
      - name: Publish compatibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: client-compatibility
          path: .github/compatibility/artifacts
          if-no-files-found: ignore
          retention-days: 7

  publish-image:
    name: Publish Image
    if: ${{ github.repository == 'TrogonStack/TrogonEventStore' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
    needs:
      - build-images
      - test
      - client-compatibility
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/tag-docker-images.yml
    with:
      image-artifact-name: eventstore-image-noble-linux-x64
    secrets: inherit

  required:
    name: Container CI
    if: ${{ always() }}
    needs:
      - build-images
      - test
      - client-compatibility
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require successful jobs
        env:
          REQUIRED_JOBS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$REQUIRED_JOBS"
