name: Publish Container Image

on:
  workflow_call:
    inputs:
      image-artifact-name:
        required: true
        type: string

jobs:
  publish-container-image:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install task runner
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.8.2
          install: false
          cache: false
      - name: Download Container
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.image-artifact-name }}
      - name: Load Container
        run: mise run --skip-tools github:actions:container -- load-runtime
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Container
        env:
          IMAGE: ghcr.io/trogonstack/trogoneventstore
        run: mise run --skip-tools github:actions:publish-container
