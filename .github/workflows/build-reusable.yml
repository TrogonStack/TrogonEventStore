name: Build - Reusable

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      arch:
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        configuration: [release]
    runs-on: ${{ inputs.os }}
    name: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install net10.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Install task runner
        id: mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.2
          install_args: protoc
          cache: false
      - name: Authenticate NuGet GitHub Packages
        env:
          NUGET_GITHUB_ACTOR: ${{ github.actor }}
          NUGET_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run --skip-tools github-actions:nuget-authenticate
      - name: Compile
        env:
          BUILD_CONFIGURATION: ${{ matrix.configuration }}
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_ARCH: ${{ inputs.arch }}
        run: mise run --skip-tools github-actions:dotnet-build -- compile
      - name: Verify Build
        env:
          BUILD_CONFIGURATION: ${{ matrix.configuration }}
          TARGET_ARCH: ${{ inputs.arch }}
        run: mise run --skip-tools github-actions:dotnet-build -- verify
      - name: Run Tests
        env:
          BUILD_CONFIGURATION: ${{ matrix.configuration }}
          TARGET_ARCH: ${{ inputs.arch }}
        run: mise run --skip-tools github-actions:dotnet-build -- test
      - name: Collect Test Results
        if: ${{ always() && steps.mise.outcome == 'success' }}
        run: mise run --skip-tools github-actions:dotnet-build -- collect-results
      - name: Publish Test Results (HTML)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          path: test-results.html
          name: test-results-${{ matrix.configuration }}-${{ inputs.os }}.html
      - name: Publish Test Results (All)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.configuration }}-${{ inputs.os }}
          path: test-results
