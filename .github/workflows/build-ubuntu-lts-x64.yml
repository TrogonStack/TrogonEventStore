name: Ubuntu LTS X64

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - master
      - release/v*
    tags:
      - v*

jobs:
  changes:
    name: Changes
    uses: ./.github/workflows/changes-reusable.yml

  build:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: Build
    uses: ./.github/workflows/build-reusable.yml
    with:
      os: ubuntu-24.04
      arch: x64
    secrets: inherit

  required:
    name: X64 CI
    if: ${{ always() }}
    needs:
      - changes
      - build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require successful jobs
        env:
          REQUIRED_JOBS: ${{ toJSON(needs) }}
          EXPECTED_RESULT: ${{ needs.changes.outputs.code == 'true' && 'success' || 'skipped' }}
        run: |
          jq -e --arg expected "$EXPECTED_RESULT" '
            .changes.result == "success" and
            (del(.changes) | all(.[]; .result == $expected))
          ' <<< "$REQUIRED_JOBS"
