name: Ubuntu LTS X64

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - master
      - release/v*
    tags:
      - v*

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-reusable.yml
    with:
      os: ubuntu-24.04
      arch: x64
    secrets: inherit

  required:
    name: X64 CI
    if: ${{ always() }}
    needs:
      - build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require successful jobs
        env:
          REQUIRED_JOBS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$REQUIRED_JOBS"
