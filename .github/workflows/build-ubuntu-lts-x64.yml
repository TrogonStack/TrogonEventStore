name: Ubuntu LTS X64

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - master
      - release/v*
    tags:
      - v*

jobs:
  changes:
    name: Changes
    uses: ./.github/workflows/changes-reusable.yml

  build:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: Build
    uses: ./.github/workflows/build-reusable.yml
    with:
      os: ubuntu-24.04
      arch: x64
    secrets: inherit

  required:
    name: X64 CI
    if: ${{ always() }}
    needs:
      - changes
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install task runner
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.8.2
          install: false
          cache: false
      - name: Require successful jobs
        env:
          REQUIRED_JOBS: ${{ toJSON(needs) }}
        run: mise run --skip-tools github:actions:require-successful-jobs
