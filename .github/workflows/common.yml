name: Common

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "samples/**"
      - "**.md"
  push:
    branches:
      - master
      - main
      - release/v*
    tags:
      - v*
    paths-ignore:
      - "docs/**"
      - "samples/**"
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  semantic-conventions:
    runs-on: ubuntu-latest
    name: Semantic Conventions
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install repository tools
        uses: jdx/mise-action@v4.2.3
        with:
          cache: false
      - name: Verify semantic conventions
        run: mise run semconv:check

  csharp-quality:
    runs-on: ubuntu-latest
    name: C# Quality
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install net10.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Set up .NET NuGet authentication
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/TrogonStack/index.json" \
            --name "github" \
            --username "${{ github.actor }}" \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text
      - name: Resolve comparison refs
        id: refs
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore
        run: |
          dotnet restore src/EventStore.sln
      - name: Lint unused variables
        run: |
          dotnet build --no-restore --configuration Release -p:Platform=x64 -warnaserror:CS0168,CS0219,CS8321 src/EventStore.sln
      - name: Verify C# formatting
        run: |
          ./ci/csharp-format-changed.sh src/EventStore.sln "${{ steps.refs.outputs.base }}" "${{ steps.refs.outputs.head }}"
      - name: Verify semantic convention package
        run: |
          dotnet pack --no-restore --configuration Release --output artifacts/packages \
            src/TrogonEventStore.SemanticConventions/TrogonEventStore.SemanticConventions.csproj

  vulnerability-scan:
    runs-on: ubuntu-latest
    name: Scan for Vulnerabilities
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install net10.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Set up .NET NuGet authentication
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/TrogonStack/index.json" \
            --name "github" \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text
      - name: Scan for Vulnerabilities
        run: |
          cd src
          dotnet restore
          dotnet list package --vulnerable --include-transitive | tee vulnerabilities.txt
          ! cat vulnerabilities.txt | grep -q "has the following vulnerable packages"

  protolock:
    runs-on: ubuntu-latest
    name: Protolock Status
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Protolock Status
        shell: bash
        run: |
          ./protolock.sh status --uptodate

  archive-storage-contract:
    runs-on: ubuntu-latest
    name: Archive Storage Contract
    env:
      EVENTSTORE_S3_TEST_ENDPOINT: http://localhost:9000
      EVENTSTORE_S3_TEST_REGION: us-east-1
      EVENTSTORE_S3_TEST_ACCESS_KEY: archive-contract
      EVENTSTORE_S3_TEST_SECRET_KEY: archive-contract-secret-key
      EVENTSTORE_S3_RECOVERY_BUCKET: archive-recovery-${{ github.run_id }}-${{ github.run_attempt }}
    services:
      rustfs:
        image: rustfs/rustfs:1.0.0-beta.11@sha256:84ce557a0245a06a9aae5516f55ee0f007fca78d41df356f419306fdc0cb168c
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: archive-contract
          RUSTFS_SECRET_KEY: archive-contract-secret-key
        options: >-
          --health-cmd "curl --fail http://localhost:9000/health"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install net10.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Set up .NET NuGet authentication
        env:
          NUGET_GITHUB_ACTOR: ${{ github.actor }}
          NUGET_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/TrogonStack/index.json" \
            --name "github" \
            --username "$NUGET_GITHUB_ACTOR" \
            --password "$NUGET_GITHUB_TOKEN" \
            --store-password-in-clear-text
      - name: Run archive storage contract tests
        run: |
          dotnet test \
            --configuration Release \
            -p:Platform=x64 \
            -p:ContinuousIntegrationBuild=true \
            -p:RunS3Tests=true \
            --filter "FullyQualifiedName~S3ReaderTests|FullyQualifiedName~S3WriterTests|FullyQualifiedName~S3MetricsTests" \
            --logger:GitHubActions \
            src/EventStore.Core.XUnit.Tests/EventStore.Core.XUnit.Tests.csproj

      - name: Seed archive restart recovery data
        id: seed_archive_recovery
        env:
          EVENTSTORE_S3_RECOVERY_PHASE: seed
        run: |
          dotnet test \
            --configuration Release \
            --no-build \
            -p:Platform=x64 \
            -p:RunS3Tests=true \
            --filter "FullyQualifiedName~S3RestartRecoveryTests" \
            --logger:GitHubActions \
            src/EventStore.Core.XUnit.Tests/EventStore.Core.XUnit.Tests.csproj

      - name: Stop RustFS without removing its data
        env:
          RUSTFS_CONTAINER_ID: ${{ job.services.rustfs.id }}
        run: |
          timeout 20 docker stop --timeout 10 "$RUSTFS_CONTAINER_ID"
          test "$(docker inspect --format '{{.State.Status}}' "$RUSTFS_CONTAINER_ID")" = "exited"

      - name: Assert archive storage is unavailable
        env:
          EVENTSTORE_S3_RECOVERY_PHASE: unavailable
        run: |
          timeout 20 dotnet test \
            --configuration Release \
            --no-build \
            -p:Platform=x64 \
            -p:RunS3Tests=true \
            --filter "FullyQualifiedName~S3RestartRecoveryTests" \
            --logger:GitHubActions \
            src/EventStore.Core.XUnit.Tests/EventStore.Core.XUnit.Tests.csproj

      - name: Restart RustFS and verify archive recovery
        if: ${{ always() && steps.seed_archive_recovery.outcome == 'success' }}
        env:
          EVENTSTORE_S3_RECOVERY_PHASE: verify-cleanup
          RUSTFS_CONTAINER_ID: ${{ job.services.rustfs.id }}
        run: |
          docker start "$RUSTFS_CONTAINER_ID"
          timeout 30 bash -c -- 'until curl --output /dev/null --silent --fail http://localhost:9000/health; do sleep 1; done'
          dotnet test \
            --configuration Release \
            --no-build \
            -p:Platform=x64 \
            -p:RunS3Tests=true \
            --filter "FullyQualifiedName~S3RestartRecoveryTests" \
            --logger:GitHubActions \
            src/EventStore.Core.XUnit.Tests/EventStore.Core.XUnit.Tests.csproj

      - name: Run archive cluster restore gate
        run: |
          dotnet test \
            --configuration Release \
            -p:Platform=x64 \
            -p:ContinuousIntegrationBuild=true \
            --filter "TestCategory=ArchiveIntegration" \
            --logger:GitHubActions \
            src/EventStore.Core.Tests/EventStore.Core.Tests.csproj

  docker-compose:
    runs-on: ubuntu-latest
    name: Docker Compose Smoke Test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Github Registry Docker Login
        uses: docker/login-action@v4
        with:
          registry: docker.pkg.github.com
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker Compose Smoke Test
        env:
          DOCKER_BUILDKIT: 1
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker compose build
          docker compose up --detach
          printf 'Waiting for cluster'
          timeout 60 bash -c -- 'until curl --output /dev/null --silent --insecure --fail https://localhost:2113/-/readiness; do printf '.'; sleep 2; done'
          docker compose down
