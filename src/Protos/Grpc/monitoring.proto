syntax = "proto3";
package event_store.client.monitoring;
option java_package = "com.eventstore.dbclient.proto.monitoring";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

service Monitoring {
	rpc Stats(StatsReq) returns (stream StatsResp);
	rpc ConnectionStats(ConnectionStatsReq) returns (ConnectionStatsResp);
	rpc ReplicationStats(ReplicationStatsReq) returns (ReplicationStatsResp);
}

message StatsReq {
	bool use_metadata = 1;
	string stats_path = 2;
	optional bool use_grouping = 3;
	uint64 refresh_time_period_in_ms = 4;
}

message StatsResp {
	map<string, string> stats = 1;
	google.protobuf.Value structured_stats = 2;
}

message ConnectionStatsReq {
}

message ConnectionStatsResp {
	repeated ConnectionStats connections = 1;
}

message ConnectionStats {
	string remote_endpoint = 1;
	string local_endpoint = 2;
	string client_connection_name = 3;
	string connection_id = 4;
	int64 total_bytes_sent = 5;
	int64 total_bytes_received = 6;
	int64 pending_send_bytes = 7;
	int64 pending_received_bytes = 8;
	bool is_tls = 9;
	string protocol = 10;
	string application = 11;
	google.protobuf.Timestamp connected_at = 12;
}

message ReplicationStatsReq {
}

message ReplicationStatsResp {
	repeated ReplicationStats stats = 1;
}

message ReplicationStats {
	string subscription_id = 1;
	string connection_id = 2;
	string subscription_endpoint = 3;
	int64 total_bytes_sent = 4;
	int64 total_bytes_received = 5;
	int32 pending_send_bytes = 6;
	int32 pending_received_bytes = 7;
	int32 send_queue_size = 8;
}
